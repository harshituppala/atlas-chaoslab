[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-chaoslab"
version = "0.1.0"
description = "Evidence-first requirements intelligence and independent reliability evaluation"
requires-python = ">=3.12"
dependencies = ["fastapi==0.143.1", "uvicorn==0.54.0", "langgraph==1.2.15", "sqlalchemy==2.1.4", "psycopg[binary]==3.3.6", "pgvector==0.5.1", "opentelemetry-sdk==1.45.1", "boto3==1.43.114", "numpy==2.5.4", "pypdf==6.20.1", "defusedxml==0.7.1", "alembic==1.20.0", "pyjwt[crypto]==2.15.1", "httpx==0.28.1"]

[project.optional-dependencies]
embeddings = ["sentence-transformers==6.1.0", "torch==2.14.1"]
test = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["postgres: opt-in real local PostgreSQL integration tests", "embeddings: optional pinned local model execution"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
